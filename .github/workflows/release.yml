name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "SHA completo (40 hex) a desplegar. Vacío = última imagen construida"
        required: false
      service:
        description: "Servicio a desplegar"
        type: choice
        options: [frontend, collab]
        default: frontend

permissions:
  contents: read
  packages: write
  actions: read

env:
  IMAGE: ghcr.io/${{ github.repository }}
  COLLAB_IMAGE: ghcr.io/${{ github.repository_owner }}/tramo-collab

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${{ vars.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}
            NEXT_PUBLIC_R2_PUBLIC_BASE_URL=${{ vars.NEXT_PUBLIC_R2_PUBLIC_BASE_URL }}
            NEXT_PUBLIC_R2_PRIVATE_ORIGIN=${{ vars.NEXT_PUBLIC_R2_PRIVATE_ORIGIN }}
            NEXT_PUBLIC_COLLAB_URL=${{ vars.NEXT_PUBLIC_COLLAB_URL }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  build-collab:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.collab
          push: true
          tags: |
            ${{ env.COLLAB_IMAGE }}:${{ github.sha }}
            ${{ env.COLLAB_IMAGE }}:latest
          cache-from: type=gha,scope=collab
          cache-to: type=gha,mode=max,scope=collab

  deploy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Resolver tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ]; then
            TAG=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml \
              --branch main --event push --status success --limit 1 \
              --json headSha --jq '.[0].headSha')
          fi
          [[ "$TAG" =~ ^[a-f0-9]{40}$ ]] || { echo "tag invalido: '$TAG'"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Deploy por SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          TAG: ${{ steps.tag.outputs.tag }}
          SERVICE: ${{ inputs.service }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ci
          chmod 600 ~/.ssh/id_ci
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_ci -o IdentitiesOnly=yes "$VPS_USER@$HOST" "$SERVICE $TAG"